services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: selfsystems-api:latest
    container_name: selfsystems-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dgraph-alpha:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      SS_APP_HOST: 0.0.0.0
      SS_APP_PORT: 8080
      SS_DATABASE_TYPE: postgres
      SS_DATABASE_URL: ${SS_DATABASE_URL:-postgres://selfsystems:selfsystems@postgres:5432/self_systems?sslmode=disable}
      SS_SYNC_ENABLED: ${SS_SYNC_ENABLED:-true}
      SS_AUTH_ENABLED: ${SS_AUTH_ENABLED:-true}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: selfsystems-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SS_PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/selfsystems.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
