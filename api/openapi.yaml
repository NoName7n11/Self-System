openapi: 3.0.3
info:
  title: Self Systems API
  version: 0.1.0
  description: Phase 1 backend API (skim-tier processing, unified chat commands, URL-only resources).
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/health:
    get:
      summary: Authentication backbone health
      responses:
        "200":
          description: Auth backbone status
  /api/v1/sync/health:
    get:
      summary: Sync backbone health
      responses:
        "200":
          description: Sync backbone status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncHealthResponse'
  /api/v1/sync/metrics:
    get:
      summary: Sync observability metrics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sync observability counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SyncObservabilityMetrics'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/sync/ws:
    get:
      summary: Sync websocket endpoint
      description: Upgrades an HTTP connection to WebSocket for realtime sync events.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: since_sequence
          schema:
            type: integer
            minimum: 0
          description: Optional event sequence checkpoint. When set, the server replays buffered events newer than this sequence before emitting sync.connected.
        - in: query
          name: replay_limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
          description: Optional cap for replayed buffered events when since_sequence is provided.
      responses:
        "101":
          description: WebSocket protocol switch successful
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "400":
          $ref: '#/components/responses/BadRequestError'
  /api/v1/sync/events:
    post:
      summary: Publish sync event (bootstrap)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishSyncEventRequest'
      responses:
        "202":
          description: Event accepted for broadcast
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "400":
          $ref: '#/components/responses/BadRequestError'
  /api/v1/sync/offline-queue/enqueue:
    post:
      summary: Enqueue offline mutation for replay
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueReplayMutationRequest'
      responses:
        "202":
          description: Offline mutation queued
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "400":
          $ref: '#/components/responses/BadRequestError'
  /api/v1/sync/offline-queue/replay:
    post:
      summary: Replay queued offline mutations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayQueueRequest'
      responses:
        "200":
          description: Replay completed with summary
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sync/conflicts:
    get:
      summary: List recorded sync conflicts
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: entity_id
          schema: { type: string }
          description: Optional entity filter.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: Conflict records
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /api/v1/resources:
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        "201":
          description: Resource created
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List resources
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Resources list
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/resources/search:
    get:
      summary: Search resources
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: Search results
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/resources/semantic-search:
    get:
      summary: Semantic search resources
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        "200":
          description: Semantic search results
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/resources/{id}:
    get:
      summary: Get resource by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resource payload
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      summary: Update resource by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        "200":
          description: Resource updated
        "400":
          $ref: '#/components/responses/BadRequestError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      summary: Delete resource by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resource deleted
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/graph:
    get:
      summary: Get resource-category graph data
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 1000 }
      responses:
        "200":
          description: Graph payload for visualization
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/resources/{id}/category:
    patch:
      summary: Update resource category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: { type: string }
      responses:
        "200":
          description: Resource category updated
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/categories:
    post:
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        "201":
          description: Category created
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List categories
      responses:
        "200":
          description: Categories list
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/categories/{id}:
    get:
      summary: Get category by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category payload
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      summary: Update category by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        "200":
          description: Category updated
        "400":
          $ref: '#/components/responses/BadRequestError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      summary: Delete category by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category deleted
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/todos:
    post:
      summary: Create todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        "201":
          description: Todo created
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List todos
      responses:
        "200":
          description: Todos list
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/todos/{id}:
    get:
      summary: Get todo by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Todo payload
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      summary: Update todo by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        "200":
          description: Todo updated
        "400":
          $ref: '#/components/responses/BadRequestError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      summary: Delete todo by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Todo deleted
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/reminders:
    post:
      summary: Create reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRequest'
      responses:
        "201":
          description: Reminder created
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: List reminders
      responses:
        "200":
          description: Reminders list
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/reminders/{id}:
    get:
      summary: Get reminder by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reminder payload
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      summary: Update reminder by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReminderRequest'
      responses:
        "200":
          description: Reminder updated
        "400":
          $ref: '#/components/responses/BadRequestError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
    delete:
      summary: Delete reminder by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reminder deleted
        "404":
          $ref: '#/components/responses/NotFoundError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/processing/deep/health:
    get:
      summary: Deep processing runtime health
      responses:
        "200":
          description: Deep processing health snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeepProcessingHealth'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/processing/deep/metrics:
    get:
      summary: Deep processing queue and cost metrics
      responses:
        "200":
          description: Deep processing metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeepProcessingMetrics'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/processing/deep/reprocess/{id}:
    post:
      summary: Queue a resource for deep processing replay
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Resource accepted for deep reprocessing
        "400":
          $ref: '#/components/responses/BadRequestError'
        "429":
          description: Deep processing queue is full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/chat/commands:
    post:
      summary: Execute unified chat command
      description: |
        Supported commands include create and retrieval operations.
        Examples:
        - resource: https://example.com | category=Research
        - search: AI agents | limit=10
        - semantic search: knowledge graph agents | limit=10
        - list resources | limit=20
        - list categories
        - create todo Read paper | details=Focus on section 3
        - list todos | limit=10
        - create reminder Follow up | at=2026-04-15T10:00:00Z
        - list reminders | limit=10
        - get category <id>
        - update category <id> | name=Knowledge Systems | description=Updated
        - delete category <id>
        - get resource <id>
        - update resource <id> | title=Updated Title | summary=Updated
        - delete resource <id>
        - get todo <id>
        - update todo <id> | title=Updated | status=done | due=2026-04-22T10:00:00Z
        - delete todo <id>
        - get reminder <id>
        - update reminder <id> | title=Updated | at=2026-04-22T10:00:00Z | status=sent
        - delete reminder <id>
        - graph | limit=1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "resource: https://example.com | category=Research"
      responses:
        "200":
          description: Command executed
        "400":
          $ref: '#/components/responses/BadRequestError'
        "500":
          $ref: '#/components/responses/InternalServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequestError:
      description: Request failed validation or payload parsing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Required service dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication is required or token validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Requested entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
          example: validation_error
    CreateResourceRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        summary: { type: string }
        category_id: { type: string }
        category_name: { type: string }
    PublishSyncEventRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum:
            - sync.update
            - sync.reconnected
            - sync.resource.created
            - sync.resource.updated
            - sync.resource.deleted
            - sync.category.updated
            - sync.todo.updated
            - sync.reminder.updated
          example: sync.resource.updated
        payload:
          type: object
          additionalProperties: true
          description: Include entity_id for entity-scoped event types.
          example:
            entity_id: res-1
            changed_fields: [title, summary]
    EnqueueReplayMutationRequest:
      type: object
      required: [type, payload]
      properties:
        operation_id:
          type: string
          description: Optional client-generated idempotency key.
          example: op-123
        type:
          type: string
          enum:
            - sync.update
            - sync.reconnected
            - sync.resource.created
            - sync.resource.updated
            - sync.resource.deleted
            - sync.category.updated
            - sync.todo.updated
            - sync.reminder.updated
          example: sync.resource.updated
        occurred_at:
          type: string
          format: date-time
          description: Optional mutation timestamp. Defaults to server now.
        payload:
          type: object
          additionalProperties: true
          description: Must include entity_id for deterministic replay.
          example:
            entity_id: res-1
            title: Updated after reconnect
    ReplayQueueRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          default: 100
    ReplaySummary:
      type: object
      properties:
        queued_count: { type: integer }
        replayed_count: { type: integer }
        emitted_count: { type: integer }
        conflict_count: { type: integer }
    SyncConflictRecord:
      type: object
      properties:
        id: { type: string }
        entity_id: { type: string }
        event_type: { type: string }
        existing_operation_id: { type: string }
        incoming_operation_id: { type: string }
        winner_operation_id: { type: string }
        reason: { type: string }
        resolved_at: { type: string, format: date-time }
    SyncHubStats:
      type: object
      properties:
        connected_clients: { type: integer }
        published_total: { type: integer }
        dropped_total: { type: integer }
        last_sequence: { type: integer }
        history_depth: { type: integer }
    SyncHealthResponse:
      type: object
      properties:
        status: { type: string }
        sync_enabled: { type: boolean }
        websocket_path: { type: string }
        connected_clients: { type: integer }
        offline_replay: { type: boolean }
        hub:
          $ref: '#/components/schemas/SyncHubStats'
        metrics:
          $ref: '#/components/schemas/SyncObservabilityMetrics'
    SyncObservabilityMetrics:
      type: object
      properties:
        auth_failures_total: { type: integer }
        websocket_upgrade_failures_total: { type: integer }
        websocket_connections_total: { type: integer }
        websocket_disconnections_total: { type: integer }
        sync_events_published_total: { type: integer }
        sync_event_rejected_total: { type: integer }
        replay_enqueue_accepted_total: { type: integer }
        replay_enqueue_rejected_total: { type: integer }
        replay_requests_total: { type: integer }
        replay_requests_succeeded_total: { type: integer }
        replay_requests_failed_total: { type: integer }
        replay_mutations_replayed_total: { type: integer }
        replay_events_emitted_total: { type: integer }
        replay_conflicts_total: { type: integer }
        conflict_list_requests_total: { type: integer }
        conflict_list_failed_total: { type: integer }
    DeepProcessingMetrics:
      type: object
      properties:
        enabled: { type: boolean }
        queue_depth: { type: integer }
        queue_capacity: { type: integer }
        worker_count: { type: integer }
        max_tasks_per_minute: { type: integer }
        max_tokens_per_day: { type: integer }
        tokens_used_today: { type: integer }
        enqueued_total: { type: integer }
        processed_total: { type: integer }
        failed_total: { type: integer }
        rejected_total: { type: integer }
        low_cost_route_total: { type: integer }
        high_cost_route_total: { type: integer }
        low_cost_model: { type: string }
        high_cost_model: { type: string }
        low_cost_estimated_tokens: { type: integer }
        high_cost_estimated_tokens: { type: integer }
        last_processed_at: { type: string, format: date-time }
        last_error: { type: string }
    DeepProcessingHealth:
      type: object
      properties:
        status: { type: string }
        deep_enabled: { type: boolean }
        backlog: { type: integer }
        queue_capacity: { type: integer }
        metrics:
          $ref: '#/components/schemas/DeepProcessingMetrics'
    UpdateResourceRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        summary: { type: string }
        category_id: { type: string }
        category_name: { type: string }
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    CreateTodoRequest:
