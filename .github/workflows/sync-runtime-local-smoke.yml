name: Sync Runtime Local Smoke

on:
  workflow_dispatch:
    inputs:
      port:
        description: Local port to run the API server on
        required: false
        default: "18080"
        type: string
      timeout_seconds:
        description: Timeout per verification request in seconds
        required: false
        default: "15"
        type: string

permissions:
  contents: read

jobs:
  verify-local-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start local sync runtime
        id: start_server
        shell: bash
        run: |
          mkdir -p artifacts
          SS_APP_HOST=127.0.0.1 SS_APP_PORT="${{ inputs.port }}" SS_SYNC_ENABLED=true SS_AUTH_ENABLED=false go run ./cmd/server > artifacts/local-smoke-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > artifacts/local-smoke-server.pid
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

      - name: Wait for local health
        id: wait_for_server
        shell: bash
        run: |
          READY=false
          for _ in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${{ inputs.port }}/health" > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          echo "ready=${READY}" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "Local server did not become healthy in time."
            exit 1
          fi

      - name: Run local reachability verification
        id: verify
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ steps.wait_for_server.outputs.ready }}" != "true" ]; then
            cat > artifacts/sync-runtime-reachability-local-smoke.json <<EOF
            {
              "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "base_url": "http://127.0.0.1:${{ inputs.port }}",
              "errors": ["local server did not become healthy in time"]
            }
            EOF
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          go run ./scripts/verify_sync_runtime \
            -base-url "http://127.0.0.1:${{ inputs.port }}" \
            -timeout-seconds "${{ inputs.timeout_seconds }}" \
            -report-file artifacts/sync-runtime-reachability-local-smoke.json \
            > artifacts/sync-runtime-reachability-local-smoke-stdout.json
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish local smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sync Runtime Local Smoke"
            echo ""
            echo "- Local URL: http://127.0.0.1:${{ inputs.port }}"
            echo "- Server ready: ${{ steps.wait_for_server.outputs.ready }}"
            echo "- Verification exit code: ${{ steps.verify.outputs.exit_code }}"
            echo ""
            if [ -f artifacts/sync-runtime-reachability-local-smoke.json ]; then
              echo "### Verification Report"
              echo '```json'
              cat artifacts/sync-runtime-reachability-local-smoke.json
              echo '```'
            else
              echo "No verification report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload local smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-runtime-local-smoke
          path: |
            artifacts/sync-runtime-reachability-local-smoke.json
            artifacts/sync-runtime-reachability-local-smoke-stdout.json
            artifacts/local-smoke-server.log
            artifacts/local-smoke-server.pid
          if-no-files-found: warn

      - name: Stop local sync runtime
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/local-smoke-server.pid ]; then
            PID=$(cat artifacts/local-smoke-server.pid)
            if [ -n "$PID" ]; then
              kill "$PID" || true
            fi
          fi

      - name: Enforce local verification success
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.verify.outputs.exit_code }}" != "0" ]; then
            echo "Local sync runtime smoke verification failed. See sync-runtime-local-smoke artifact."
            exit 1
          fi
