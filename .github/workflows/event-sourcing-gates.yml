name: Event Sourcing Gates

# Runs property-based tests, reconnect-sequence tests, the rollback drill,
# and the backfill benchmark on every push / PR to master.
#
# These are the WS7 safety gates for the Change 3 event sourcing migration.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  event-sourcing-gates:
    name: Event Sourcing Safety Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Tidy modules
        run: go mod tidy

      # ── Property-based tests ──────────────────────────────────────────────
      # Run the fuzz corpus (seed entries only — no continuous fuzzing in CI).
      # These validate version monotonicity and projection determinism.
      - name: Property tests — eventstore invariants
        run: |
          go test -run 'TestEventVersionMonotonicity|TestProjectionDeterminism|FuzzEventVersion|FuzzProjection' \
            ./internal/eventstore/... -v -timeout 5m

      # ── Sync reconnect sequence tests ─────────────────────────────────────
      - name: Sync reconnect sequence tests
        run: |
          go test -run 'TestReconnect|FuzzReconnect' \
            ./internal/sync/... -v -timeout 5m

      # ── Rollback drill ────────────────────────────────────────────────────
      # Exercises the flag ON → OFF → parity path. Exit 1 if any assertion fails.
      - name: Rollback drill
        run: go run ./scripts/rollback_drill

      # ── Backfill benchmark (budget gate) ─────────────────────────────────
      # Run the benchmark with a small iteration count (10x) so the gate is fast.
      # The full 100K benchmark (30-min budget) is run manually or on release tags.
      - name: Backfill benchmark — fast smoke (10 iterations)
        run: |
          go test -run '^$' -bench BenchmarkBackfill \
            -benchtime=10x -timeout 10m \
            ./internal/migration/... -v

      # ── AI pipeline tests ─────────────────────────────────────────────────────
      - name: AI pipeline integration tests (mock provider — no real API calls)
        run: |
          go test -run 'TestAIPipeline|TestClassifier|TestEmbedding|TestManager_Enrich|TestParseEnrichment' \
            ./internal/ai/... ./internal/service/... ./test/integration/... -v -timeout 5m

      # ── Content extraction tests ──────────────────────────────────────────────
      - name: Extraction unit + integration tests
        run: |
          go test -run 'TestURL|TestPDF|TestImage|TestEvent|TestDeepProcessor' \
            ./internal/extractor/... ./test/integration/... -v -timeout 5m

      # ── Full test suite (regression guard) ────────────────────────────────
      - name: Full test suite
        run: go test ./... -timeout 10m
