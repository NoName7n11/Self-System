name: Release Checklist

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      run_tests:
        description: Run full Go test suite as part of checklist
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate version input
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Use vMAJOR.MINOR.PATCH, e.g. v0.1.0"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Ensure changelog entry exists
        shell: bash
        run: |
          if ! grep -q "^## \[${VERSION_NO_V}\]" CHANGELOG.md; then
            echo "CHANGELOG entry missing for ${VERSION_NO_V}"
            echo "Expected heading: ## [${VERSION_NO_V}]"
            exit 1
          fi

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: go test ./...

      - name: Publish checklist summary
        shell: bash
        run: |
          {
            echo "## Release Checklist Result"
            echo ""
            echo "- Version input valid: ${VERSION}"
            echo "- CHANGELOG entry found: [${VERSION_NO_V}]"
            if [ "${{ inputs.run_tests }}" = "true" ]; then
              echo "- Go tests: passed"
            else
              echo "- Go tests: skipped by input"
            fi
            echo ""
            echo "### Next commands"
            echo "- git tag ${VERSION}"
            echo "- git push origin ${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
