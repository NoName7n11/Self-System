name: Feature Request
description: Propose an improvement or new capability.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the user value first, then the implementation idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What pain point are you trying to solve?
      placeholder: As a user, I need ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and Constraints
      description: Include dependencies, risks, and out-of-scope items.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List verifiable conditions for completion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      options:
        - API
        - Service Layer
        - Repository Layer
        - Configuration
        - DevOps/CI
        - Documentation
        - Other
    validations:
      required: true
