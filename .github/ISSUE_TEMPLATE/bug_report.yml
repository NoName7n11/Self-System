name: Bug Report
description: Report a defect or regression in behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Call endpoint ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Relevant logs, stack traces, or screenshots.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or Commit
      description: Tag, commit SHA, or branch where issue appears.
      placeholder: v0.1.0 or a1b2c3d
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Windows
        - Local Linux
        - CI pipeline
        - Other
    validations:
      required: true
