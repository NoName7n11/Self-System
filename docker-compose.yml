version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: selfsystems-postgres
    ports:
      - "${SS_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${SS_POSTGRES_DB:-self_systems}
      POSTGRES_USER: ${SS_POSTGRES_USER:-selfsystems}
      POSTGRES_PASSWORD: ${SS_POSTGRES_PASSWORD:-selfsystems}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: selfsystems-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dgraph-zero:
    image: dgraph/dgraph:latest
    container_name: selfsystems-dgraph-zero
    ports:
      - "5080:5080"
      - "6080:6080"
    command: ["dgraph", "zero", "--my=dgraph-zero:5080"]
    volumes:
      - dgraph_zero:/dgraph

  dgraph-alpha:
    image: dgraph/dgraph:latest
    container_name: selfsystems-dgraph-alpha
    depends_on:
      - dgraph-zero
    ports:
      - "8081:8080"
      - "9080:9080"
    command: ["dgraph", "alpha", "--my=dgraph-alpha:7080", "--zero=dgraph-zero:5080", "--security", "whitelist=0.0.0.0/0"]
    volumes:
      - dgraph_alpha:/dgraph

volumes:
  postgres_data:
  redis_data:
  dgraph_zero:
  dgraph_alpha:
